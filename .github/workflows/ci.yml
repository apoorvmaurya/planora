name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Lint and Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Production Dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm exec tsc --noEmit

      - name: Run Tests
        run: pnpm test

      - name: Verify Application Build
        run: pnpm run build
        env:
          # Mock variables required at build time by our env.ts validator
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-project-ref.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
          LOCATIONIQ_KEY: "mock-locationiq-key"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: "mock-vapid-public-key"
          VAPID_PRIVATE_KEY: "mock-vapid-private-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key"
          # Disable Next.js telemetry
          NEXT_TELEMETRY_DISABLED: 1
